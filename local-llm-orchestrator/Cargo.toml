[package]
name = "llmo"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Local LLM Memory & Runtime Orchestrator: one private OpenAI-compatible endpoint with long-term memory and on-demand model runtimes"
license = "MIT"
readme = "README.md"
keywords = ["llm", "local-ai", "memory", "ollama", "llama-cpp"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
