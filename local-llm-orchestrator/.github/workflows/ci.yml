name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llmo:ci .
      - name: Container refuses to start unauthenticated, starts with a key
        run: |
          ! docker run --rm llmo:ci serve
          docker run -d --name llmo -e LLMO_API_KEY=ci-key-0123456789abcdef -p 8765:8765 llmo:ci
          for i in $(seq 30); do curl -fs localhost:8765/ready && break; sleep 1; done
          curl -fs localhost:8765/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/v1/models)" = 401
          docker rm -f llmo
