# llmo — Local LLM Memory & Runtime Orchestrator
# Copy to ~/.config/llmo/config.toml (or run `llmo init`).

# Runtime used when a requested model is not matched to any runtime.
default_runtime = "ollama"

[server]
# Loopback only by default. Nothing leaves this machine.
# Binding beyond loopback (e.g. 0.0.0.0) requires an API key.
bind = "127.0.0.1:8765"
max_concurrent_requests = 64     # extra /v1 requests get 503 + Retry-After
upstream_timeout_secs = 600      # total limit for non-streaming generations
stream_idle_timeout_secs = 120   # max silence between streamed chunks
max_body_mb = 32

# Simplest auth: one admin key (min 16 chars). Or set LLMO_API_KEY.
# api_key = "change-me-to-a-long-random-string"

# Team setups: named keys with roles and namespace scopes.
# Create with `llmo key new --name alice --namespace alice --namespace 'team-*'`
# (only the SHA-256 is stored here).
# [[server.keys]]
# name = "ops"
# role = "admin"
# key_sha256 = "<64 hex chars>"
#
# [[server.keys]]
# name = "alice"
# role = "user"                  # chat + memory in her namespaces only
# key_sha256 = "<64 hex chars>"
# namespaces = ["alice", "team-*"]

[memory]
# db_path = "~/.local/share/llmo/memory.db"
top_k = 5
min_score = 0.25
max_context_chars = 4000
recency_half_life_days = 30
# Scrub emails, API keys, tokens and similar secrets before storing.
redact = true
# Also remember assistant replies (off: replies restate memories and snowball).
store_assistant = false

# Built-in, offline, model-free embedder (default):
[memory.embedder]
kind = "hash"
dim = 512

# Or use a real embedding model served by one of your runtimes:
# [memory.embedder]
# kind = "runtime"
# runtime = "ollama"
# model = "nomic-embed-text"

[budget]
# Total RAM/VRAM (MB) that managed runtimes may claim at once.
# Starting a runtime that would exceed it stops idle runtimes first (LRU).
# 0 = automatic (detected RAM minus an OS reserve, plus GPU VRAM).
memory_mb = 0

# Built-in model runner: download GGUF models from Hugging Face in the UI and
# run them with a llama.cpp build llmo fetches itself. All keys optional.
[engine]
downloads = true                         # false = air-gapped (no downloads)
hf_endpoint = "https://huggingface.co"   # or an internal mirror; HF_ENDPOINT overrides
# hf_token = "hf_..."                    # gated/private repos; HF_TOKEN overrides
github_api = "https://api.github.com"    # where llama.cpp releases are looked up
llama_cpp_repo = "ggml-org/llama.cpp"
llama_cpp_version = "latest"             # pin a tag (e.g. "b6550") for reproducibility
runner = "auto"                          # auto | builtin | llama.cpp (see README)
threads = 0                              # built-in engine CPU threads (0 = physical cores)
backend = "auto"                         # llama.cpp build: auto | cpu | cuda | vulkan | metal
# llama_server = "/opt/llama.cpp/llama-server"  # use an existing binary instead
# models_dir = "~/llm-models"
# ca_bundle = "/etc/ssl/corp-root.pem"   # TLS-inspecting corporate proxy
ctx = 4096
idle_timeout_secs = 900
server_args = ["-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0", "--jinja"]

# An externally managed runtime (you start it yourself).
[[runtimes]]
name = "ollama"
base_url = "http://127.0.0.1:11434"
models = ["llama3.2:3b", "nomic-embed-text"]

# A runtime the orchestrator launches on demand and stops when idle.
[[runtimes]]
name = "qwen"
base_url = "http://127.0.0.1:8081"
models = ["qwen2.5-7b-instruct"]
startup_timeout_secs = 120

[runtimes.process]
command = "llama-server"
args = ["-m", "/models/qwen2.5-7b-instruct-q4_k_m.gguf", "--port", "8081", "-c", "8192"]
memory_mb = 6000
idle_timeout_secs = 600
